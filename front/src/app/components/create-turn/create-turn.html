<div class="card">
  <h2>Crear nuevo turno</h2>
  <form [formGroup]="turnForm" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="date">Fecha y Hora</label>
      <input type="datetime-local" id="date" formControlname="date" />

      <small class="error" *ngif="turnForm.get('date')?.touched && turnForm.get('date')?.invalid">
        Selecciona una fecha y hora valida
      </small>

    </div>

    <div class="field checkbox">
      <label>
        <input type="checkbox" formControlName="status">
        Turno Activo.
      </label>
    </div>
    <button type="subit" [disabled]="turnForm.invalid">Guardar turno</button>
  </form>
</div>
